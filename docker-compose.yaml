# =============================================================================
# 测试自动化平台 —— 一键起 docker-compose
#
# 起：    docker compose up -d
# 停：    docker compose down
# 重建：  docker compose up -d --build
# 看日志: docker compose logs -f api
#         docker compose logs -f worker
#
# 默认端口暴露：
#   8000 → FastAPI（前端 SPA + /api/*）
#   6379 → Redis
#   5432 → Postgres
#
# 想跑 App 自动化（Android/iOS）需要再起 Appium 容器；这里没默认带，
# 因为模拟器/物理机情况各异，参见 docker-compose.legacy.yaml.bak 里
# 注释掉的 android_emulator + appium_server 块作为参考。
# =============================================================================
x-app-common: &app-common
  build: .
  image: ghcr.io/yuanshirenasdas24525/test_automation_platform:latest
  environment: &app-env
    TZ: Asia/Shanghai
    PYTHONUNBUFFERED: "1"
    # 探活
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    # Web 自动化：容器内无显示器，强制无头模式；本地调试时可 docker run -e WEB_HEADLESS=false
    WEB_HEADLESS: "true"
    # Celery broker / backend（celery_app.py 当前是写死的，
    # 改造成读 env 后这两行就生效；现状下作为文档保留）
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    # 平台 DB —— 使用 PostgreSQL
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: tap
    DB_PASSWORD: tap_pass
    DB_NAME: tap
  volumes: &app-vols
    # 数据 / 日志 / 报告 / app 包都挂出来，container 重建不丢数据
    - ./data:/app/data
    - ./config:/app/config
    # Playwright 浏览器内核缓存（chromium 等），重建镜像后不用重新下载
    - playwright_cache:/root/.cache/ms-playwright
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped


services:
  # -------------------------------------------------------------------------
  # 1. Redis —— Celery broker + result backend
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tap_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # 2. Postgres —— 平台元数据库
  # 想用 SQLite：删掉这个 service 和上面 app-env 的 DB_* / depends_on.postgres
  # 想用 MySQL：换成 mysql:8 镜像 + 改 DB_HOST/USER 等环境变量
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tap_postgres
    environment:
      POSTGRES_USER: tap
      POSTGRES_PASSWORD: tap_pass
      POSTGRES_DB: tap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tap"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # 3. FastAPI（API + 前端 SPA）
  # 启动时会自动跑 alembic upgrade head（entrypoint 里）
  # -------------------------------------------------------------------------
  api:
    <<: *app-common
    container_name: tap_api
    command:
      - uvicorn
      - server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
    ports:
      - "8000:8000"

  # -------------------------------------------------------------------------
  # 4. Celery worker —— 跑用例 / 设备探活 / 报告聚合
  # 用 -c 控制并发；本地调试可以改 1
  # -------------------------------------------------------------------------
  worker:
    <<: *app-common
    container_name: tap_worker
    command:
      - celery
      - -A
      - celery_app
      - worker
      - --loglevel=INFO
      - -c
      - "4"
    # worker 不监听 HTTP，关掉默认健康检查
    healthcheck:
      disable: true

  # -------------------------------------------------------------------------
  # 5. Celery beat —— 定时任务调度器（probe_devices 等）
  # 一个集群只能起一个 beat，否则会重复触发
  # -------------------------------------------------------------------------
  beat:
    <<: *app-common
    container_name: tap_beat
    command:
      - celery
      - -A
      - celery_app
      - beat
      - --loglevel=INFO
      - --schedule
      - /app/data/celerybeat-schedule.db
    healthcheck:
      disable: true

  # -------------------------------------------------------------------------
  # 6. Appium Server —— App 自动化（Android / iOS）
  # Appium 2 镜像，预装 UiAutomator2（Android）和 XCUITest（iOS）驱动。
  # 注意：
  #   - Android 需要 adb 连通设备/模拟器，推荐 network_mode: host 或挂载 adb socket
  #   - iOS 需要 macOS 宿主机 + Xcode，无法在 Linux 容器内运行
  #   - 连接方式：在 devices 表注册设备时，agent_host 填 appium-server 的 host，
  #     appium_port 填 4723
  # -------------------------------------------------------------------------
  appium:
    image: appium/appium:latest
    platform: linux/amd64
    container_name: tap_appium
    ports:
      - "4723:4723"
    volumes:
      # adb key 持久化（Android 设备授权）
      - appium_adb_keys:/home/androidusr/.android
      # 可选：挂载 APK/IPA 目录（安装 app 步骤用）
      - ./data/app_packages:/app/app_packages:ro
    environment:
      TZ: Asia/Shanghai
      # Android：保持 adb 连接存活
      ADB_SERVER_SOCKET: tcp:host.docker.internal:5037
      # Android/iOS 驱动自动安装（首次启动从 npm 拉）
      APPIUM_DRIVER_UIAUTOMATOR2: "true"
      APPIUM_DRIVER_XCUITEST: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4723/status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -------------------------------------------------------------------------
  # 7. Android Emulator（可选 —— 资源占用很大）
  # 如果不想连真机，可以用容器化模拟器。需要宿主机支持 KVM。
  # 取消注释下面这组配置，同时把 appium 的 ADB_SERVER_SOCKET 改成 emulator 地址。
  # -------------------------------------------------------------------------
  # android_emulator:
  #   image: budtmo/docker-android:emulator_13.0
  #   container_name: tap_android_emulator
  #   privileged: true
  #   ports:
  #     - "6080:6080"     # noVNC 网页控制台
  #     - "5554:5554"     # adb connect
  #     - "5555:5555"
  #   environment:
  #     DEVICE: "pixel_6"
  #     EMULATOR_ARGS: "-no-window -no-audio -gpu swiftshader_indirect"
  #     APPIUM: "true"
  #   volumes:
  #     - android_emulator_data:/data
  #   restart: unless-stopped


volumes:
  redis_data:
  postgres_data:
  playwright_cache:
  appium_adb_keys:
