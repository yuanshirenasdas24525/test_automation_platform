# =============================================================================
# 测试自动化平台 —— 一键起 docker-compose
#
# 起：    docker compose up -d
# 停：    docker compose down
# 重建：  docker compose up -d --build
# 看日志: docker compose logs -f api
#         docker compose logs -f worker
#
# 默认端口暴露：
#   8000 → FastAPI（前端 SPA + /api/*）
#   6379 → Redis
#   5432 → Postgres
#
# 想跑 App 自动化（Android/iOS）需要再起 Appium 容器；这里没默认带，
# 因为模拟器/物理机情况各异，参见 docker-compose.legacy.yaml.bak 里
# 注释掉的 android_emulator + appium_server 块作为参考。
# =============================================================================
x-app-common: &app-common
  image: ghcr.io/yuanshirenasdas24525/test_automation_platform:latest
  environment: &app-env
    TZ: Asia/Shanghai
    PYTHONUNBUFFERED: "1"
    # 探活
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    # Celery broker / backend（celery_app.py 当前是写死的，
    # 改造成读 env 后这两行就生效；现状下作为文档保留）
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    # 平台 DB（如果 config/object_conf.ini 已经改成读 env，下面就生效）
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: tap
    DB_PASSWORD: tap_pass
    DB_NAME: tap
  volumes: &app-vols
    # 数据 / 日志 / 报告 / app 包都挂出来，container 重建不丢数据
    - ./data:/app/data
    - ./config:/app/config
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
  restart: unless-stopped


services:
  # -------------------------------------------------------------------------
  # 1. Redis —— Celery broker + result backend
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # 2. Postgres —— 平台元数据库
  # 想用 SQLite：删掉这个 service 和上面 app-env 的 DB_* / depends_on.postgres
  # 想用 MySQL：换成 mysql:8 镜像 + 改 DB_HOST/USER 等环境变量
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: tap_postgres
    environment:
      POSTGRES_USER: tap
      POSTGRES_PASSWORD: tap_pass
      POSTGRES_DB: tap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tap"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # 3. FastAPI（API + 前端 SPA）
  # 启动时会自动跑 alembic upgrade head（entrypoint 里）
  # -------------------------------------------------------------------------
  api:
    <<: *app-common
    container_name: tap_api
    command:
      - uvicorn
      - server.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
    ports:
      - "8000:8000"

  # -------------------------------------------------------------------------
  # 4. Celery worker —— 跑用例 / 设备探活 / 报告聚合
  # 用 -c 控制并发；本地调试可以改 1
  # -------------------------------------------------------------------------
  worker:
    <<: *app-common
    container_name: tap_worker
    command:
      - celery
      - -A
      - celery_app
      - worker
      - --loglevel=INFO
      - -c
      - "4"
    # worker 不监听 HTTP，关掉默认健康检查
    healthcheck:
      disable: true

  # -------------------------------------------------------------------------
  # 5. Celery beat —— 定时任务调度器（probe_devices 等）
  # 一个集群只能起一个 beat，否则会重复触发
  # -------------------------------------------------------------------------
  beat:
    <<: *app-common
    container_name: tap_beat
    command:
      - celery
      - -A
      - celery_app
      - beat
      - --loglevel=INFO
      - --schedule
      - /app/data/celerybeat-schedule.db
    healthcheck:
      disable: true


volumes:
  redis_data:
  postgres_data:
