<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <!-- UI 录制中心旧版线框原型，归档于 docs/元素库与UI录制。 -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
