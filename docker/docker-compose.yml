version: '3.8'

services:
  redis:
    image: redis:7
    container_name: test_platform_redis
    ports:
      - "6379:6379"
    restart: always

  postgres:
    image: postgres:15
    container_name: test_platform_postgres
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: