<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动化测试平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="sidebar">
        <div class="logo">
            <i class="fas fa-cubes" style="color:#3b82f6;"></i>
            <span>One-Stop QA</span>
        </div>

        <div class="nav-item active" onclick="router.home(); setActive(this)">
            <i class="fas fa-th-large"></i> 平台总览
        </div>

        <div class="nav-section-title">Automation Core</div>

        <div class="nav-group">
            <div class="nav-item" onclick="toggleSubNav('api-sub', this)">
                <i class="fas fa-network-wired"></i> API 自动化
                <i class="fas fa-chevron-down arrow"></i>
            </div>
            <ul id="api-sub" class="sub-nav">
                <li onclick="router.configManager('api')">环境变量配置</li>
                <li onclick="router.projectList('API')">接口用例库</li>
            </ul>
        </div>

        <div class="nav-group">
            <div class="nav-item" onclick="toggleSubNav('web-sub', this)">
                <i class="fas fa-globe"></i> WEB 自动化
                <i class="fas fa-chevron-down arrow"></i>
            </div>
            <ul id="web-sub" class="sub-nav">
                <li onclick="router.configManager('web')">浏览器驱动参数</li>
                <li onclick="router.projectList('Web')">UI 项目管理</li>
            </ul>
        </div>

        <div class="nav-group">
            <div class="nav-item" onclick="toggleSubNav('app-sub', this)">
                <i class="fas fa-mobile-alt"></i> MOBILE 自动化
                <i class="fas fa-chevron-down arrow"></i>
            </div>
            <ul id="app-sub" class="sub-nav">
                <li onclick="router.configManager('mobile')">真机/模拟器参数</li>
                <li onclick="router.projectList('App')">App 自动化项目</li>
            </ul>
        </div>

        <div class="nav-section-title">Intelligent Tools</div>

        <div class="nav-group">
            <div class="nav-item" onclick="toggleSubNav('tools-sub', this)">
                <i class="fas fa-bolt"></i> 效能工具箱
                <i class="fas fa-chevron-down arrow"></i>
            </div>
            <ul id="tools-sub" class="sub-nav">
                <li onclick="router.toolModule('requirement')">需求逻辑分析</li>
                <li onclick="router.toolModule('generator')">AI 用例生成</li>
                <li onclick="router.toolModule('analysis')">覆盖度可视化</li>
            </ul>
        </div>
    </div>

    <div id="main-content">
        <div id="view-container">
            </div>
    </div>

    <div id="project-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">新增项目</h3><br>
            <div class="form-group">
                <label>项目名称 (必填, 最长10字)</label>
                <input type="text" id="p-name" maxlength="10">
            </div>
            <div class="form-group">
                <label>项目简介 (最长50字)</label>
                <textarea id="p-desc" maxlength="50"></textarea>
            </div>
            <div class="form-group">
                <label>项目类型</label>
                <select id="p-type">
                    <option value="API">API</option>
                    <option value="Web">Web</option>
                    <option value="Mobile">Mobile</option>
                </select>
            </div>
            <div class="form-group">
                <label>Icon (URL或Emoji)</label>
                <input type="text" id="p-icon" placeholder="例如: 🚀">
            </div>
            <button class="btn btn-primary" onclick="submitProject()">确定</button>
            <button class="btn btn-ghost" onclick="closeModal('project-modal')">取消</button>
        </div>
    </div>

    <div id="module-modal" class="modal">
        <div class="modal-content">
            <h3>新增模块</h3><br>
            <div class="form-group">
                <label>模块名称</label>
                <input type="text" id="m-name">
            </div>
            <button class="btn btn-primary" onclick="submitModule()">确定</button>
            <button class="btn btn-ghost" onclick="closeModal('module-modal')">取消</button>
        </div>
    </div>

    <div id="case-modal" class="modal">
        <div class="modal-content" style="width: 850px; max-width: 90vw;">
            <h3 id="case-modal-title">编辑测试用例</h3>
            <hr style="margin: 15px 0; opacity: 0.2;">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>用例名称*</label>
                    <input type="text" id="c-name" placeholder="必填" required>
                </div>
                <div class="form-group">
                    <label>方法*</label>
                    <select id="c-method">
                        <option value="POST">POST</option>
                        <option value="GET">GET</option>
                        <option value="PUT">PUT</option>
                        <option value="DELETE">DELETE</option>
                        <option value="PATCH">PATCH</option>
                    </select>
                </div>

                <div class="form-group" style="grid-column: span 2;">
                    <label>请求路径 (Path)*</label>
                    <input type="text" id="c-path" placeholder="/api/v1/login">
                </div>

                <div class="form-group">
                    <label>数据类型 (Content-Type)*</label>
                    <select id="c-data-type">
                        <option value="application/json">application/json</option>
                        <option value="x-www-form-urlencoded">x-www-form-urlencoded</option>
                        <option value="form-data">form-data</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>等待时间 (秒)</label>
                    <input type="number" id="c-wait-time" value="0">
                </div>

                <div class="form-group">
                    <label>请求头 (Headers) [JSON]</label>
                    <textarea id="c-headers" onblur="validateJson(this)" placeholder="{}"></textarea>
                    <span class="json-error">JSON格式错误</span>
                </div>
                <div class="form-group">
                    <label>请求参数 (Params/Body) [JSON]</label>
                    <textarea id="c-params" onblur="validateJson(this)" placeholder="{}"></textarea>
                    <span class="json-error">JSON格式错误</span>
                </div>

                <div class="form-group">
                    <label>提取数据 (Extract) [JSON]</label>
                    <textarea id="c-extract" onblur="validateJson(this)" placeholder='{"token": "$.data.token"}'></textarea>
                    <span class="json-error">JSON格式错误</span>
                </div>
                <div class="form-group">
                    <label>断言 (Assertion) [JSON]*</label>
                    <textarea id="c-assertion" onblur="validateJson(this)" placeholder='{"code": 200}'></textarea>
                    <span class="json-error">JSON格式错误</span>
                </div>

                <div class="form-group">
                    <label>SQL 查询 (选填)</label>
                    <textarea id="c-sql" placeholder="SELECT * FROM users WHERE..."></textarea>
                </div>

                <div class="form-group">
                    <label>文件路径 (选填)</label>
                    <input type="text" id="c-file-path" placeholder="上传文件路径">
                </div>

                <div class="form-group">
                    <label>用例描述</label>
                    <textarea id="c-desc" placeholder="简述用例目的"></textarea>
                </div>
                <div class="form-group" style="padding-top: 30px;">
                    <label><input type="checkbox" id="c-skip" style="width: auto;"> 是否跳过该用例</label>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: right; border-top: 1px solid #eee; padding-top: 15px;">
                <button class="btn btn-ghost" onclick="closeModal('case-modal')">取消</button>
                <button class="btn btn-primary" onclick="submitCase()">提交保存</button>
            </div>
        </div>
</div>

    <div id="import-modal" class="modal">
        <div class="modal-content" style="width: 400px;">
            <h3>批量导入用例</h3>
            <p style="font-size: 12px; color: #666;">请上传符合模板格式的 .xlsx 文件</p>
            <input type="file" id="import-file-input" accept=".xlsx" style="margin: 20px 0;">
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('import-modal')">取消</button>
                <button class="btn btn-primary" onclick="submitImport()">开始导入</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
