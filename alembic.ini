# Alembic 配置文件
# 运行方式：
#   alembic upgrade head                          # 应用所有迁移
#   alembic downgrade -1                          # 回滚一个版本
#   alembic revision --autogenerate -m "xxx"      # 基于 model 差异自动生成迁移
#   alembic history                               # 查看历史
#
# ⚠️ 数据库连接 URL 不在这里硬编码，由 env.py 从**环境变量**动态组装
#    （ALEMBIC_DB_URL 或 DB_HOST 等，本地走 .env）。要临时覆盖用 ALEMBIC_DB_URL。

[alembic]
# 迁移脚本目录
script_location = database/migrations

# 模板：用 env 里自动注入 URL
# sqlalchemy.url = postgresql+psycopg2://user:pwd@host:5432/db
sqlalchemy.url =

# 文件名模板：包含日期戳，便于 review
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# 时区
timezone = Asia/Shanghai

# 版本路径分隔符
version_path_separator = os


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
